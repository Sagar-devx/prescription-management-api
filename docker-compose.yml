version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: prescription_postgres
    environment:
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical123
      POSTGRES_DB: prescription_db
    ports:
      - "5432:5432"
    volumes:
      - prescription_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d prescription_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prescription_pgdata:
