spring:
  datasource:
    url: jdbc:h2:mem:prescription_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDER=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: a-very-long-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-for-hs256
  expiration: 900000
